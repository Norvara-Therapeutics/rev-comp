[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "norvara-rev-comp"
version = "1.0.0rc1"
description = "Reverse complement, transcription and multi-frame translation with no third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
maintainers = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
keywords = ["bioinformatics", "dna", "rna", "translation", "fasta", "sequence-analysis"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Norvara-Therapeutics/rev-comp"
Repository = "https://github.com/Norvara-Therapeutics/rev-comp.git"
Issues = "https://github.com/Norvara-Therapeutics/rev-comp/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
rev-comp = "revcomp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/revcomp"]
addopts = "--doctest-modules"
